@props(books: []Book, title: string = "Books Catalog")

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>odnet - {title}</title>
  <link rel="stylesheet" href="/static/css/Styles.css?v=2">
</head>
<body class="bg-slate-50 min-h-screen text-slate-900 antialiased selection:bg-blue-100 selection:text-blue-900">
  <header class="border-b border-slate-200 bg-white/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-blue-600 flex items-center justify-center text-white font-bold text-sm shadow-sm">
          od
        </div>
        <div>
          <span class="font-bold text-slate-900 tracking-tight text-lg">odnet</span>
          <span class="ml-1.5 px-2 py-0.5 rounded text-[11px] font-semibold bg-blue-50 text-blue-700 border border-blue-200">v1.0</span>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <a href="/home" class="text-xs font-semibold text-slate-600 hover:text-blue-600 transition">Home</a>
        <a href="/books" class="text-xs font-semibold text-blue-600 transition">Books</a>
        <a href="/json" class="text-xs font-semibold text-slate-600 hover:text-blue-600 transition">JSON API</a>
        <a href="/plaintext" class="text-xs font-semibold text-slate-600 hover:text-blue-600 transition">Plaintext</a>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-6 py-10">
    @BookCatalog(books: books, title: title)
  </main>
</body>
</html>
